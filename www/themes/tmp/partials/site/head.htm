<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ this.page.meta_title ?: this.page.title ~ ' | Интернет магазин Цветочный Сад' }}</title>

<meta name="description" content="{{ this.page.meta_description }}">
<meta name="keywords" content="{{ this.page.meta_keywords }}">
<meta name="author" content="Цветочный Сад">
<meta name="robots" content="index, follow">
<meta property="og:title" content="{{ this.page.meta_title ?: this.page.title }}">
<meta property="og:description" content="{{ this.page.meta_description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ this.page.url }}">
<meta property="og:image" content="{{ this.page.meta_image ?: global.favicon.path }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ this.page.meta_title ?: this.page.title }}">
<meta name="twitter:description" content="{{ this.page.meta_description }}">
<meta name="twitter:image" content="{{ this.page.meta_image ?: global.favicon.path }}">

<link rel="canonical" href="{{ this.page.url }}">
<link rel="icon" href="{{ global.favicon.path }}" type="{{ global.favicon.content_type }}">
<link rel="stylesheet" href="{{ ['assets/css/app.css','assets/css/main.css'] | theme }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

{% styles %}
