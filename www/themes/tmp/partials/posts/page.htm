<div class="py-3">
    {% partial 'gl/breadcrumbs' items=breadcrumbs %}    
</div>

<div class="container" itemscope itemtype="https://schema.org/BlogPosting">

    <h1 class="title" itemprop="headline">{{ this.page.title }}</h1>
    
    <meta itemprop="datePublished" content="{{ page.created_at | date('Y-m-d') }}">
    <meta itemprop="dateModified" content="{{ page.updated_at | date('Y-m-d') }}">
    <meta itemprop="author" content="Цветочный Сад">
    
    <div itemprop="publisher" itemscope itemtype="https://schema.org/Organization">
        <meta itemprop="name" content="Цветочный Сад">
        <link itemprop="url" href="{{ this.page.url }}">
    </div>
    
    {% if page.preview %}
        <meta itemprop="image" content="{{ page.preview.path }}">
    {% endif %}

    <div class="flex">
    
        <div class="text mt-5 flex-1 mr-10 pb-11" itemprop="articleBody">
            {{ page.content | content }}
        </div>

        <div class="w-[380px] bg-gray-100">
            
        </div>

    </div>

</div>
