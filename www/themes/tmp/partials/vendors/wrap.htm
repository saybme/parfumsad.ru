<div class="w-full overflow-hidden" id="logos">
    <div class="flex  items-center gap-x-5">
        {% for item in vendors %}
            <div class="flex-none">
                <a href="/directory?vendor={{ item.id }}" title="{{ item.title }}">
                    <img src="{{ item.logo.thumb(100,100) }}" alt="{{ item.name }}">
                </a>
            </div>
        {% endfor %}
    </div>
</div>

{% put scripts %}
    <script>
        marqueeLogos()
    </script>
{% endput %}
