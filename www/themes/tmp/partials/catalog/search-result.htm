{% if products is empty or products|length == 0 %}
    <div class="py-6">
        <div role="alert" class="alert alert-warning">
            <span>Ничего не найдено</span>
        </div>
    </div>
{% else %}
    <div class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-x-3 lg:gap-x-6 gap-y-10">
            {% for item in products %}
                <div class="flex flex-col">
                    {% partial 'products/item' item=item %}   
                </div>
            {% endfor %}
        </div>
        <div class="">
            {{ pager(products) }}
        </div>
    </div>
{% endif %}
