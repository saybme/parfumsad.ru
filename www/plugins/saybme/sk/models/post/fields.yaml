tabs:
    fields:
        content:
            label: 'Подробный текст'
            size: giant
            span: full
            type: richeditor
            tab: Описание
        props[seo_title]:
            label: SEO Заголовок
            span: full
            type: text
            tab: SEO
            comment: SEO заголовок страницы (title)
        props[seo_description]:
            label: SEO Описание
            span: full
            type: textarea
            tab: SEO
            comment: SEO описание страницы (meta description)
        props[seo_keywords]:
            label: SEO Ключевые слова
            span: full
            type: text
            tab: SEO
            comment: SEO ключевые слова страницы (meta keywords)
        created_at:
            label: Создан
            mode: datetime
            span: auto
            disabled: 1
            type: datepicker
            tab: Информация
        updated_at:
            label: Обновлен
            mode: datetime
            span: auto
            disabled: 1
            type: datepicker
            tab: Информация        
fields:    
    name:
        label: Пост
        span: auto
        type: text
    slug:
        label: SLUG
        span: auto
        preset:
            field: name
            type: slug
        type: text
    description:
        label: 'Вводный текст'
        size: small
        span: full
        type: textarea
secondaryTabs:
    fields:
        is_active:
            label: Опубликован
            span: full
            default: 1
            type: checkbox
        preview:
            label: Превью
            span: full
            type: fileupload
            mode: image
