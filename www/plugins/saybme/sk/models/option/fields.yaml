# ===================================
#  Form Field Definitions for Option
# ===================================

tabs:
    defaultTab: 'Основная информация'

fields:
    # ========== ОСНОВНЫЕ ПОЛЯ ==========
    name:
        label: 'Системное имя'
        type: text
        span: left
        tab: 'Основная информация'
        required: true
        placeholder: 'например: color, size, brand'
        comment: 'Только латиница, без пробелов. Используется в коде и URL фильтров'

    label:
        label: 'Название для отображения'
        type: text
        span: right
        tab: 'Основная информация'
        required: true
        placeholder: 'например: Цвет, Размер, Бренд'
        comment: 'Отображается в админке и на сайте'

    # ========== ТИП ПОЛЯ ==========
    type:
        label: 'Тип поля в фильтре'
        type: dropdown
        span: left
        tab: 'Основная информация'
        required: true
        comment: 'Как будет выглядеть фильтр на сайте'

    # ========== НАСТРОЙКИ ОТОБРАЖЕНИЯ ==========
    is_filterable:
        label: 'Показывать в фильтре каталога'
        type: switch
        span: right
        tab: 'Основная информация'
        default: true
        comment: 'Если выключено - опция не появится в блоке фильтров'

    sort_order:
        label: 'Порядок сортировки'
        type: number
        span: left
        tab: 'Основная информация'
        default: 0
        comment: 'Чем меньше число, тем выше в списке фильтров'





# ========== ВТОРАЯ ВКЛАДКА - ВАРИАНТЫ ЗНАЧЕНИЙ ==========
secondaryTabs:
    fields:
        variants:
            label: 'Варианты значений'
            type: partial
            path: $/saybme/sk/models/option/_variants.htm
            tab: 'Варианты значений'
            span: full
            comment: 'Добавьте возможные значения для этой характеристики'
