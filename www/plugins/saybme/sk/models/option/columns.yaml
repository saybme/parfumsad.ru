# ===================================
#  List Column Definitions
# ===================================

columns:
    id:
        label: ID
        invisible: true

    label:
        label: 'Название'
        type: text
        searchable: true
        sortable: true

    name:
        label: 'Системное имя'
        type: text
        searchable: true
        sortable: true

    type:
        label: 'Тип'
        type: text

    is_filterable:
        label: 'В фильтре'
        type: switch
        sortable: true

    sort_order:
        label: 'Порядок'
        type: number
        sortable: true

    variants_count:
        label: 'Вариантов'
        type: number
        sortable: false
        valueFrom: variants_count  # ← Используем аксессор

    created_at:
        label: 'Создано'
        type: datetime
        invisible: true

    updated_at:
        label: 'Обновлено'
        type: datetime
        invisible: true
